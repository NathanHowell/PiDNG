[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidng"
version = "4.0.9"
description = "Python utility for creating Adobe DNG files from RAW image data."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
authors = [
    {name = "Csaba Nagy"}
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/schoolpost/PiDNG"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pidng*"]

# Ensure non-Python files needed for building are included in distributions
[tool.setuptools.package-data]
"pidng" = [
    "liblj92/*.h",
]

[[tool.setuptools.ext-modules]]
name = "ljpegCompress"
sources = [
    "src/pidng/bitunpack.c",
    "src/pidng/liblj92/lj92.c"
]
include-dirs = [
    "src/pidng",
]
extra-compile-args = ["-std=gnu99"]
extra-link-args = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/pidng"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
